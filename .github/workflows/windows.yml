name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CC: gcc
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          path: luce-js
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python luce-base/tools/checkout_main.py luce-js
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Configure native library search
        shell: msys2 {0}
        run: echo "LIBRARY_PATH=$(cygpath -m /ucrt64/lib)" >> "$GITHUB_ENV"
      - name: Build the compiler
        working-directory: luce-base
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Unit tests of each module
        working-directory: luce-js
        shell: msys2 {0}
        run: |
          export PATH="$(cd ../luce-base/build && pwd):$PATH"
          for module in cutils dtoa engine host; do luce-base test "src/$module"; done
      - name: QuickJS's JavaScript tests
        working-directory: luce-js
        shell: msys2 {0}
        run: |
          export PATH="$(cd ../luce-base/build && pwd):$PATH"
          python tests/run.py
